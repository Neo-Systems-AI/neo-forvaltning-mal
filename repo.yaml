# Hva repoet er, og hvem som har ansvaret. /solution:set-up-repo fyller det ut. Godkjenneren står i .github/CODEOWNERS.

# kunde: oppsettet for én kommune eller virksomhet. standard: standardløsninger som en partner eller Neo eier.
