# Kontrollen av repoet: sjekken fra neo-forvaltning, i en låst versjon, og gitleaks. Jobben `check` samler dem; gjør den
# påkrevd i regelsettet for `main`.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repo:
    name: repo (sjekken fra neo-forvaltning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sjekken leser historikken til basen: en lagret kilde endres ikke
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sjekken er én fil uten avhengigheter fra pluginen forvaltning. Den hentes i en låst versjon og kontrolleres mot
      # sha256, fordi repoet ligger på GitHub Enterprise og neo-forvaltning på github.com. En ny versjon tas inn med en
      # PR som bytter begge verdiene her og i .claude/method.json.
      - name: Hent sjekken
        env:
          REF: "10393574cf2ff73e039df38e998784cd9942d51c"
          SHA256: "b4f7883acb9fe1fb199f55abbc786cd1642b42879e7ad0520b7ea32714ac34ae"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Neo-Systems-AI/neo-forvaltning/$REF/plugins/forvaltning/scripts/sjekk.mjs" -o "$RUNNER_TEMP/sjekk.mjs"
          echo "$SHA256  $RUNNER_TEMP/sjekk.mjs" | sha256sum -c -
      - name: Sjekken
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # Første push i et nytt repo har ingen forrige commit: da er det ingen endring å sammenligne kildene med.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD
          node "$RUNNER_TEMP/sjekk.mjs" --base "$BASE" --annotate --summary

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ingen hemmeligheter i endringen
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            OPTS="origin/$BASE..HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            OPTS="$BEFORE..$SHA"
          else
            # Første push i et nytt repo har ingen forrige commit, og etter en force-push finnes den ikke lenger: da
            # leses hele historikken fram til denne commiten.
            OPTS="$SHA"
          fi
          if docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 git --no-banner --redact --log-opts="$OPTS" .; then
            printf '## Hemmeligheter\n\n✅ gitleaks fant ingen hemmeligheter i `%s`.\n' "$OPTS" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Hemmeligheter\n\n❌ gitleaks fant noe som ligner en hemmelighet i `%s`: se loggen (verdiene er skjult).\n' "$OPTS" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  check:
    name: check
    if: always()
    needs: [repo, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Alle sjekkene over er grønne
        run: |
          printf '## check\n\n| Jobb | Resultat |\n|---|---|\n| repo | %s |\n| secrets | %s |\n' "${{ needs.repo.result }}" "${{ needs.secrets.result }}" >> "$GITHUB_STEP_SUMMARY"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
