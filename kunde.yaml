# Kundefila: hva repoet er, hvem det er for, og hvem som godkjenner. Det tekniske (miljøene, maskinklienten og
# systemene) står i .claude/neo.config.json. /forvaltning:oppstart fyller ut begge.

# Hvem som eier løsningene. kunde: kunden (én kommune eller virksomhet). standard: Neo eller en partner, og kundene
# tar dem i bruk. Strukturen er den samme.
type: kunde

# Eieren: kunden, eller Neo eller partneren i et repo for standardløsninger.
kunde:
  navn: "Eksempel kommune"
  organisasjonsnummer: ""

# Den som godkjenner en endring. Hvordan godkjenningen håndheves (regler for main, CODEOWNERS eller annet), følger
# rutinene til den som eier repoet.
godkjenner:
  navn: ""
  github: ""

# Den som forvalter: kunden selv, Neo Systems, eller en partner med egen avtale med kunden.
forvalter:
  navn: ""
  github: ""

# Versjonene repoet er laget for.
verktoy:
  mal: "0.7.1"
  forvaltning: "0.5.1"
