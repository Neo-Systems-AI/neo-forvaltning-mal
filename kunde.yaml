# Kundefila: hvem dette repoet forvalter for, hvor Neo kjører, og hvem som godkjenner. Fyll ut når repoet er laget.
kunde:
  navn: "Eksempel kommune"
  organisasjonsnummer: ""

# MCP-serveren for hvert miljø heter neo-sandkasse og neo-produksjon i .mcp.json (se README).
miljoer:
  sandkasse:
    mcp: "https://<neo-adresse>/api/mcp"
  produksjon:
    mcp: "https://<neo-adresse>/api/mcp"

# Den som godkjenner en endring hos kunden. Står også i .github/CODEOWNERS.
godkjenner:
  navn: ""
  github: ""

# Den som forvalter: kunden selv, Neo Systems, eller en partner med egen avtale med kunden.
forvalter:
  navn: ""
  github: ""

# Versjonene repoet er laget for. Sjekken sier fra når en nyere finnes.
verktoy:
  mal: "0.1.0"
  forvaltning: "0.1.0"
