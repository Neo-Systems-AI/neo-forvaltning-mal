# Kundefila: hva repoet er, hvem det er for, og hvem som godkjenner. Det tekniske (miljøene, maskinklienten og
# systemene) står i .claude/neo.config.json. /forvaltning:oppstart fyller ut begge.

# kunde: oppsettet for én kommune eller virksomhet. standard: standardløsninger som en partner eller Neo eier.
type: kunde

# Den repoet er for: kunden, eller partneren eller Neo i et repo for standardløsninger.
kunde:
  navn: "Eksempel kommune"
  organisasjonsnummer: ""

# Den som godkjenner en endring hos kunden. Står også i .github/CODEOWNERS, som er det GitHub håndhever.
godkjenner:
  navn: ""
  github: ""

# Den som forvalter: kunden selv, Neo Systems, eller en partner med egen avtale med kunden.
forvalter:
  navn: ""
  github: ""

# Versjonene repoet er laget for.
verktoy:
  mal: "0.6.0"
  forvaltning: "0.4.0"
